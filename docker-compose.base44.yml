services:
  web:
    image: python:3.12-slim
    working_dir: /app/webapp
    volumes:
      - ./:/app
      - pipcache:/root/.cache/pip
    ports:
      - "3000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - WATCHFILES_FORCE_POLLING=true
    command: >
      sh -c "pip install -q -r requirements.txt &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir backend"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  pipcache:
